services:
  postgres:
    image: postgres:16-alpine
    container_name: garts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garts_chat
      POSTGRES_USER: garts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/.env}
    # Not published to the host: only the API needs to reach it.
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garts -d garts_chat']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: garts-redis
    restart: unless-stopped
    # Sessions and presence live here, so it must survive a restart.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in infrastructure/.env}
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: garts-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://garts:${POSTGRES_PASSWORD}@postgres:5432/garts_chat?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # The API refuses to start in production if this is missing, short, or
      # left at a placeholder value.
      JWT_SECRET: ${JWT_SECRET:?generate one with `openssl rand -base64 48`}
      CORS_ORIGIN: ${CORS_ORIGIN:?set the exact origin the browser will use, e.g. https://chat.example.com}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    container_name: garts-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  redis_data:
  uploads:
